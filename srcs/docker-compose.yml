networks:
  mmembrilnet:
    name: mmembrilnet
    driver: bridge

services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - mmembrilnet


  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    image: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    networks:
      - mmembrilnet
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u$${MYSQL_ROOT_USER} -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20


  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - mmembrilnet
    env_file:
      - .env


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/mysql
      o: bind
  

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/wordpress
      o: bind