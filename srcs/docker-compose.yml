services:
  nginx:
    container_name: nginx
    image: nginx:1.26
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: always
    networks:
      - mmembrilnet

  wordpress:
    container_name: wordpress
    image: wordpress:6.6
    build: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    environment:
      MYSQL_HOSTNAME: mariadb
    restart: always
    networks:
      - mmembrilnet

  mariadb:
    container_name: mariadb
    image: mariadb:10.11
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always
    networks:
      - mmembrilnet

volumes:
  mariadb_data:
    name: inception_mariadb
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/mysql
      o: bind
  wordpress_data:
    name: inception_wordpress
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/wordpress
      o: bind

networks:
  mmembrilnet:
    name: mmembrilnet
    driver: bridge
