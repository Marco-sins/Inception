services:
  nginx:
    container_name: nginx_inception
    image: nginx:1.26
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - html:/var/www/html
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    restart: always
    networks:
      - inception

  wordpress:
    container_name: wordpress_inception
    image: wordpress:6.6
    build: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - html:/var/www/html
    env_file:
      - .env
    environment:
      MYSQL_HOSTNAME: mariadb
    restart: always
    networks:
      - inception

  mariadb:
    container_name: db_inception
    image: mariadb:10.11
    build: ./requirements/mariadb
    volumes:
      - database:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always
    networks:
      - inception

volumes:
  database:
    name: database
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/database
      o: bind
  html:
    name: html
    driver: local
    driver_opts:
      type: none
      device: /home/mmembril/data/html
      o: bind

networks:
  inception:
    name: inception
    driver: bridge
